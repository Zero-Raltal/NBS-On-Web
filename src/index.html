<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note Block Studio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="screen"></canvas>
  <input id="hiddeninput" type="text" autocomplete="off" spellcheck="false">
  <div id="drop-hint">松开以打开歌曲</div>
  <!-- 启动画面。
       这段是【纯 HTML + CSS】，不含任何 JS 依赖，且放在所有脚本标签之前，
       所以在 JS 还没下载/解析完的时候浏览器就能立刻画出来 —— 用户不会对着白屏等。
       动画与 cbnote 同款：文字后面的三个点依次脉冲（纯 CSS @keyframes）。
       进度条和文字由 main.js 在启动过程中更新；JS 完全没起来时这里就停在初始文案。 -->
  <div id="loading">
    <div class="logo">Note Block Studio</div>
    <div class="boottext">正在加载 Javascript<span class="bd bd1">.</span><span class="bd bd2">.</span><span class="bd bd3">.</span></div>
    <div class="barwrap"><div class="bar" id="loadbar"></div></div>
    <div class="msg" id="loadmsg">正在载入界面素材...</div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/theme.js"></script>
<script src="js/atlas-data.js"></script>
<script src="js/assets.js"></script>
<script src="js/song.js"></script>
<script src="js/history.js"></script>
<script src="js/audio.js"></script>
<script src="js/selection.js"></script>
<script src="js/macros.js"></script>
<script src="js/ui.js"></script>
<script src="js/nbs.js"></script>
<script src="js/midi-map.js"></script>
<script src="js/midi.js"></script>
<script src="js/schematic.js"></script>
<script src="js/cbnd.js"></script>
<script src="js/editor.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/main.js"></script>
</body>
</html>
